<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wayfinder — offline</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0A1626; color: #fff; font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
         padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom); box-sizing: border-box; }
  main { max-width: 360px; text-align: center; }
  .mark { width: 72px; height: 72px; border-radius: 20px; margin: 0 auto 24px;
          background: linear-gradient(135deg, #0A5DC2, #0FB5AE); display: grid; place-items: center; }
  h1 { font-size: 24px; margin: 0 0 8px; }
  p { color: rgba(255,255,255,.72); margin: 0 0 24px; }
  button { font: 600 16px system-ui, sans-serif; color: #fff; background: #0A5DC2; border: 0;
           border-radius: 14px; padding: 14px 28px; box-shadow: 0 10px 24px rgba(10,93,194,.45); }
</style>
</head>
<body>
<main>
  <div class="mark"><svg width="34" height="34" viewBox="0 0 24 24" fill="#fff"><polygon points="3 11 22 2 13 21 11 13 3 11"/></svg></div>
  <h1>No connection</h1>
  <p>Wayfinder needs a signal to open the first time. Hospital basements are often dead spots — try near a window or the main entrance, or join the guest Wi-Fi.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
