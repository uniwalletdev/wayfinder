# Worldwide hospitals and indoor maps from OpenStreetMap.
#
# Sandboxed development environments can't reach Overpass, so the fetching
# happens here (see scripts/world/). Each run:
#   1. fetches every named hospital per country      -> data/world/hospitals/
#   2. finds hospitals whose insides are mapped and
#      downloads their indoor geometry               -> data/world/indoor-raw/
#   2b. fetches what is mapped on every hospital's
#      grounds (buildings, entrances, car parks,
#      paths), state by state for large countries    -> data/world/campus-raw/ (not committed)
#   3. builds the app's per-country files, indoor
#      venues and site-map venues                    -> public/world/, public/floorplans/osm/
#
# A run started by a push to a feature branch commits the results back to that
# branch, so they ride along in its pull request. A scheduled or manual run on
# main opens a pull request instead. The UK is skipped: its hospitals come from
# the NHS register (nhs-data.yml).
#
# Data © OpenStreetMap contributors, ODbL 1.0. Attribution is shown in the app.
name: World hospital data

on:
  schedule:
    - cron: "41 2 12 * *"
  workflow_dispatch:
    inputs:
      countries:
        description: "Comma-separated ISO codes, or ALL"
        default: "ALL"
      max_detail:
        description: "Most hospitals to download indoor geometry for"
        default: "400"
  push:
    paths:
      - "scripts/world/**"
      - ".github/workflows/world-data.yml"

concurrency:
  group: world-data-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  # A push runs a sample so a change to the scripts is checked in minutes; the
  # monthly schedule and a manual run with ALL cover the world.
  COUNTRIES: ${{ github.event_name == 'push' && 'LU,BE,NL,CH,AT,DE,DK,IE,US' || inputs.countries || 'ALL' }}
  MAX_DETAIL: ${{ github.event_name == 'push' && '60' || inputs.max_detail || '400' }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Hospitals per country
        run: |
          if [ "$COUNTRIES" = "ALL" ]; then node scripts/world/fetch-hospitals.mjs
          else node scripts/world/fetch-hospitals.mjs --countries "$COUNTRIES"; fi

      - name: Indoor mapping
        run: |
          if [ "$COUNTRIES" = "ALL" ]; then node scripts/world/fetch-indoor.mjs --max-detail "$MAX_DETAIL"
          else node scripts/world/fetch-indoor.mjs --countries "$COUNTRIES" --max-detail "$MAX_DETAIL"; fi

      - name: Hospital grounds
        run: |
          if [ "$COUNTRIES" = "ALL" ]; then node scripts/world/fetch-campus.mjs
          else node scripts/world/fetch-campus.mjs --countries "$COUNTRIES"; fi

      - name: Build the app's files
        run: node scripts/world/build.mjs

      - name: Summarise
        if: always()
        run: |
          {
            echo "## World hospital data ($COUNTRIES)"
            echo
            node -e '
              const fs = require("fs");
              const dir = "data/world/hospitals";
              if (!fs.existsSync(dir)) process.exit(0);
              let n = 0, c = 0;
              for (const f of fs.readdirSync(dir)) { const d = JSON.parse(fs.readFileSync(dir + "/" + f)); n += d.hospitals.length; c++; }
              console.log(`- **${n}** hospitals in **${c}** countries`);
              if (fs.existsSync("data/world/indoor-candidates.json")) {
                const k = JSON.parse(fs.readFileSync("data/world/indoor-candidates.json")).candidates;
                console.log(`- **${k.length}** hospitals with some indoor mapping; top: ` + k.slice(0, 8).map(x => `${x.name} (${x.country}, ${x.named} named rooms)`).join("; "));
              }
              const raw = "data/world/indoor-raw";
              if (fs.existsSync(raw)) console.log(`- indoor geometry downloaded for **${fs.readdirSync(raw).length}** hospitals`);
              if (fs.existsSync("data/world/campus-report.json")) {
                const c = JSON.parse(fs.readFileSync("data/world/campus-report.json"));
                const per = {};
                for (const b of c.built) per[b.country] = (per[b.country] ?? 0) + 1;
                console.log(`- **${c.built.length}** site maps built from hospital grounds: ` + Object.entries(per).map(([k, v]) => `${k} ${v}`).join(", ") + (Object.keys(c.refused).length ? `; refused: ` + Object.entries(c.refused).map(([k, v]) => `${k} ×${v}`).join(", ") : ""));
              }
              if (fs.existsSync("data/world/indoor-report.json")) {
                const r = JSON.parse(fs.readFileSync("data/world/indoor-report.json"));
                console.log(`- **${r.built.length}** indoor venues built: ` + r.built.slice(0, 12).map(x => `${x.name} (${x.country}, ${x.floors} floors, ${x.waypoints} places)`).join("; "));
                if (r.refused.length) console.log(`- ${r.refused.length} refused: ` + r.refused.slice(0, 8).map(x => `${x.name} — ${x.reason}`).join("; "));
              }
            '
          } >> "$GITHUB_STEP_SUMMARY"

      # A feature branch gets the results as a commit of its own. Pushes made
      # with the workflow token do not start further workflow runs, so this
      # cannot loop.
      - name: Commit to the branch
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "Findway data"
          git config user.email "data@findway.invalid"
          # One pathspec that matches nothing makes git add refuse the lot, so
          # only the folders that exist are named.
          for p in data/world public/world public/floorplans/osm; do
            [ -e "$p" ] && git add -A -- "$p"
          done
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh world hospital data from OpenStreetMap ($COUNTRIES)" -m "Data © OpenStreetMap contributors, ODbL 1.0."
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Needs "Allow GitHub Actions to create and approve pull requests" under
      # Settings → Actions → General. Without it the branch is still pushed and
      # the summary says where to open the pull request by hand.
      - name: Open a pull request
        if: github.ref == 'refs/heads/main'
        id: pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/world-data
          base: main
          add-paths: |
            data/world
            public/world
            public/floorplans/osm
          commit-message: "Refresh world hospital data from OpenStreetMap"
          title: "Refresh world hospital data from OpenStreetMap"
          body: |
            Automated refresh run by `.github/workflows/world-data.yml`. The run
            summary has the counts. Data © OpenStreetMap contributors, ODbL 1.0.
          labels: automated, data
          delete-branch: true
      - name: Say where the data went when no pull request could be opened
        if: github.ref == 'refs/heads/main' && steps.pr.outcome == 'failure'
        run: |
          {
            echo
            echo "The refreshed data was pushed to the branch \`automation/world-data\` but GitHub Actions is not allowed to open pull requests in this repository (Settings → Actions → General → Workflow permissions)."
            echo "Open it by hand: https://github.com/${GITHUB_REPOSITORY}/compare/main...automation/world-data?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
