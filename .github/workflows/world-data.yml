# Worldwide hospitals and indoor maps from OpenStreetMap.
#
# Sandboxed development environments can't reach Overpass, so the fetching
# happens here (see scripts/world/). Each run:
#   1. fetches every named hospital per country      -> data/world/hospitals/
#   2. finds hospitals whose insides are mapped and
#      downloads their indoor geometry               -> data/world/indoor-raw/
#   2b. fetches what is mapped on every hospital's
#      grounds (buildings, entrances, car parks,
#      paths), state by state for large countries    -> data/world/campus-raw/ (not committed)
#   3. builds the app's per-country files, indoor
#      venues and site-map venues                    -> public/world/, public/floorplans/osm/ (not committed)
#   4. publishes them into the shared Postgres       -> /api/world/* serves them
#
# The built files are published, not committed: they run to hundreds of
# megabytes across the world. What a run commits back is the small raw data
# under data/world (hospital lists, indoor geometry, reports), so a later run
# can reuse it: a push to a feature branch commits to that branch, a scheduled
# or manual run on main opens a pull request. The UK is skipped: its hospitals
# come from the NHS register (nhs-data.yml).
#
# Data © OpenStreetMap contributors, ODbL 1.0. Attribution is shown in the app.
name: World hospital data

on:
  schedule:
    - cron: "41 2 12 * *"
  workflow_dispatch:
    inputs:
      countries:
        description: "Comma-separated ISO codes, or ALL"
        default: "ALL"
      max_detail:
        description: "Most hospitals to download indoor geometry for"
        default: "400"
      budget_min:
        description: "Minutes for the grounds stage before it stops and leaves the rest to the next run (the job itself times out at 330)"
        default: "270"
  push:
    paths:
      - "scripts/world/**"
      - ".github/workflows/world-data.yml"

concurrency:
  group: world-data-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

env:
  # A push runs a sample so a change to the scripts is checked within the
  # hour: a few European countries, the US, and Nigeria, Ghana, Kenya, South
  # Africa and Egypt for the other kind of coverage OpenStreetMap has. The
  # monthly schedule and a manual run with ALL cover the world.
  COUNTRIES: ${{ github.event_name == 'push' && 'LU,BE,NL,CH,AT,DE,DK,IE,US,NG,GH,KE,ZA,EG' || inputs.countries || 'ALL' }}
  MAX_DETAIL: ${{ github.event_name == 'push' && '60' || inputs.max_detail || '400' }}
  # A push that changes the scripts reuses hospital lists and indoor geometry
  # fetched in the last two days; the schedule and a manual run fetch afresh.
  REUSE_DAYS: ${{ github.event_name == 'push' && '2' || '0' }}
  # Grounds are fetched area by area (a country, or a state of a large one),
  # and each area that comes in whole is kept for a week in the Actions cache,
  # so a run that runs out of time carries on where the last one stopped. The
  # stage stops with a margin under the job's timeout; a country with areas
  # still to fetch is held back from publishing until a run completes it. A
  # complete answer late is preferred to a partial one on time.
  CAMPUS_REUSE_DAYS: "7"
  CAMPUS_BUDGET_MIN: ${{ inputs.budget_min || '270' }}
  # The shared Postgres the website reads from (Railway's public URL). Without
  # it the run still builds and reports, and publishes nothing.
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Hospitals per country
        run: |
          if [ "$COUNTRIES" = "ALL" ]; then node scripts/world/fetch-hospitals.mjs --reuse-days "$REUSE_DAYS"
          else node scripts/world/fetch-hospitals.mjs --countries "$COUNTRIES" --reuse-days "$REUSE_DAYS"; fi

      - name: Indoor mapping
        run: |
          if [ "$COUNTRIES" = "ALL" ]; then node scripts/world/fetch-indoor.mjs --max-detail "$MAX_DETAIL" --reuse-days "$REUSE_DAYS"
          else node scripts/world/fetch-indoor.mjs --countries "$COUNTRIES" --max-detail "$MAX_DETAIL" --reuse-days "$REUSE_DAYS"; fi

      # A branch's runs can also read the cache main's runs saved, not the
      # other way round; each run saves its own copy under its id.
      - name: Grounds fetched by earlier runs
        uses: actions/cache/restore@v4
        with:
          path: data/world/campus-raw/areas
          key: campus-areas-${{ github.run_id }}
          restore-keys: campus-areas-

      - name: Hospital grounds
        run: |
          if [ "$COUNTRIES" = "ALL" ]; then node scripts/world/fetch-campus.mjs --reuse-days "$CAMPUS_REUSE_DAYS" ${CAMPUS_BUDGET_MIN:+--budget-min "$CAMPUS_BUDGET_MIN"}
          else node scripts/world/fetch-campus.mjs --countries "$COUNTRIES" --reuse-days "$CAMPUS_REUSE_DAYS" ${CAMPUS_BUDGET_MIN:+--budget-min "$CAMPUS_BUDGET_MIN"}; fi

      - name: Keep the grounds for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/world/campus-raw/areas
          key: campus-areas-${{ github.run_id }}

      - name: Build the app's files
        run: node scripts/world/build.mjs

      - name: Publish to the database
        id: publish
        if: env.DATABASE_URL != ''
        run: node scripts/world/publish.mjs

      - name: Summarise
        if: always()
        env:
          PUBLISHED: ${{ steps.publish.outcome }}
        run: |
          {
            echo "## World hospital data ($COUNTRIES)"
            echo
            case "$PUBLISHED" in
              success) echo "- published to the shared database: every country and map is listed at /coverage on the site" ;;
              failure) echo "- **publishing to the database failed**: see the Publish to the database step" ;;
              *) echo "- **not published**: add the DATABASE_URL repository secret (docs/world-data.md)" ;;
            esac
            node -e '
              const fs = require("fs");
              const dir = "data/world/hospitals";
              if (!fs.existsSync(dir)) process.exit(0);
              let n = 0, c = 0;
              for (const f of fs.readdirSync(dir)) { const d = JSON.parse(fs.readFileSync(dir + "/" + f)); n += d.hospitals.length; c++; }
              console.log(`- **${n}** hospitals in **${c}** countries`);
              if (fs.existsSync("data/world/indoor-candidates.json")) {
                const k = JSON.parse(fs.readFileSync("data/world/indoor-candidates.json")).candidates;
                console.log(`- **${k.length}** hospitals with some indoor mapping; top: ` + k.slice(0, 8).map(x => `${x.name} (${x.country}, ${x.named} named rooms)`).join("; "));
              }
              const raw = "data/world/indoor-raw";
              if (fs.existsSync(raw)) console.log(`- indoor geometry downloaded for **${fs.readdirSync(raw).length}** hospitals`);
              if (fs.existsSync("data/world/campus-raw/status.json")) {
                const s = JSON.parse(fs.readFileSync("data/world/campus-raw/status.json"));
                const held = Object.entries(s.countries).filter(([, c]) => !c.complete);
                const why = (c) => [c.left ? `${c.left} areas left` : "", c.failed ? `${c.failed} failed` : "", c.note ?? ""].filter(Boolean).join(", ");
                console.log(held.length
                  ? `- grounds **incomplete for ${held.length}** of ${Object.keys(s.countries).length} countries, held back from publishing until a run completes them: ` + held.map(([k, c]) => `${k} (${why(c)})`).join("; ")
                  : `- grounds complete for every country covered (${Object.keys(s.countries).length})`);
              }
              if (fs.existsSync("data/world/campus-report.json")) {
                const c = JSON.parse(fs.readFileSync("data/world/campus-report.json"));
                const per = {};
                for (const b of c.built) per[b.country] = (per[b.country] ?? 0) + 1;
                console.log(`- **${c.built.length}** site maps built from hospital grounds: ` + Object.entries(per).map(([k, v]) => `${k} ${v}`).join(", ") + (Object.keys(c.refused).length ? `; refused: ` + Object.entries(c.refused).map(([k, v]) => `${k} ×${v}`).join(", ") : ""));
              }
              if (fs.existsSync("data/world/indoor-report.json")) {
                const r = JSON.parse(fs.readFileSync("data/world/indoor-report.json"));
                console.log(`- **${r.built.length}** indoor venues built: ` + r.built.slice(0, 12).map(x => `${x.name} (${x.country}, ${x.floors} floors, ${x.waypoints} places)`).join("; "));
                if (r.refused.length) console.log(`- ${r.refused.length} refused: ` + r.refused.slice(0, 8).map(x => `${x.name} — ${x.reason}`).join("; "));
              }
            '
          } >> "$GITHUB_STEP_SUMMARY"

      # A feature branch gets the results as a commit of its own. Pushes made
      # with the workflow token do not start further workflow runs, so this
      # cannot loop.
      - name: Commit to the branch
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "Findway data"
          git config user.email "data@findway.invalid"
          # One pathspec that matches nothing makes git add refuse the lot, so
          # only the folders that exist are named.
          git add -A -- data/world
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Refresh world hospital data from OpenStreetMap ($COUNTRIES)" -m "Data © OpenStreetMap contributors, ODbL 1.0."
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      # Needs "Allow GitHub Actions to create and approve pull requests" under
      # Settings → Actions → General. Without it the branch is still pushed and
      # the summary says where to open the pull request by hand.
      - name: Open a pull request
        if: github.ref == 'refs/heads/main'
        id: pr
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/world-data
          base: main
          add-paths: |
            data/world
          commit-message: "Refresh world hospital data from OpenStreetMap"
          title: "Refresh world hospital data from OpenStreetMap"
          body: |
            Automated refresh run by `.github/workflows/world-data.yml`. The run
            summary has the counts. Data © OpenStreetMap contributors, ODbL 1.0.
          labels: automated, data
          delete-branch: true
      - name: Say where the data went when no pull request could be opened
        if: github.ref == 'refs/heads/main' && steps.pr.outcome == 'failure'
        run: |
          {
            echo
            echo "The refreshed data was pushed to the branch \`automation/world-data\` but GitHub Actions is not allowed to open pull requests in this repository (Settings → Actions → General → Workflow permissions)."
            echo "Open it by hand: https://github.com/${GITHUB_REPOSITORY}/compare/main...automation/world-data?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
