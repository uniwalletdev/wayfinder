# One-off: run scripts/world/migrate-legacy-venues.mjs to recover the
# PDF-derived floor-plan venues from the abandoned backup/legacy-world-pipeline
# branch into the live Postgres-backed world-data system. Manual dispatch
# only, not scheduled — delete this workflow file once the migration has run
# successfully; the script itself is worth keeping for the record.
name: Migrate legacy world venues

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Parse and match only, no database writes"
        type: boolean
        default: true

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: git fetch origin backup/legacy-world-pipeline:refs/remotes/origin/backup/legacy-world-pipeline
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            node scripts/world/migrate-legacy-venues.mjs --dry-run
          else
            node scripts/world/migrate-legacy-venues.mjs
          fi
