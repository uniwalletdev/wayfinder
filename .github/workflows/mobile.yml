# Build the Android and iOS apps.
#
# The apps carry the interface inside them (capacitor.config.ts): every run
# first exports the pages with scripts/app-shell-build.mjs, then packages that
# export into both native projects. The one thing decided here is which
# deployment the apps call for /api, FINDWAY_API_URL. It defaults to the
# production site; a repository variable or a manual run can override it.
#
# Every run produces installable test builds:
#   - findway-android-debug.apk   sideload on any Android phone
#   - Findway-simulator.app.zip   drag onto an iOS Simulator
#
# Store builds are produced only when signing material is configured, because
# an unsigned release is of no use to either store. Each one carries the
# workflow run number as its build number (Android versionCode, iOS
# CFBundleVersion), so every run is uploadable without editing a project.
#   Android: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,
#            ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD        -> findway-android-release.aab
#   iOS:     APPLE_TEAM_ID, APP_STORE_CONNECT_KEY_ID,
#            APP_STORE_CONNECT_ISSUER_ID, APP_STORE_CONNECT_KEY_P8 -> findway-ios-release.ipa
#
# Run the workflow by hand with "upload" ticked to send those builds straight
# to TestFlight and to Play's internal testing track (Play also needs
# PLAY_SERVICE_ACCOUNT_JSON). docs/mobile.md walks through creating each secret.
#
# Because the apps bundle the pages, a change under src/ or public/ reaches
# installed apps only through a new build here, unlike the website. Runs are
# deliberate (manual, or a change to the native projects) rather than on every
# push, since each iOS run spends macOS runner minutes.
name: Mobile apps

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "Deployment the apps call for /api (defaults to the FINDWAY_API_URL repository variable, then the production site)"
        required: false
      upload:
        description: "Upload the signed builds to TestFlight and Play internal testing"
        type: boolean
        default: false
  push:
    paths:
      - "android/**"
      - "ios/**"
      - "mobile/**"
      - "capacitor.config.ts"
      - "scripts/app-shell-build.mjs"
      - "scripts/mobile-icons.mjs"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "android/**"
      - "ios/**"
      - "mobile/**"
      - "capacitor.config.ts"
      - "scripts/app-shell-build.mjs"
      - ".github/workflows/mobile.yml"

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  FINDWAY_API_URL: ${{ inputs.api_url || vars.FINDWAY_API_URL || 'https://wayfinder-theta.vercel.app' }}
  # Monotonic across runs of this workflow, which is all the stores ask of a
  # build number. The user-facing version (1.0) lives in the native projects.
  BUILD_NUMBER: ${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Secrets cannot appear in a step's `if`; a job-level flag can.
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      # ubuntu-latest ships the Android SDK (ANDROID_HOME); the setup action's
      # own sdkmanager run failed on it, and Gradle fetches any missing
      # platform or build-tools itself.

      - run: npm ci
      - name: Build the pages the app carries
        run: npm run mobile:build
      - name: Package them into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Build signed release bundle
        if: env.HAS_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        working-directory: android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon bundleRelease \
            -PversionCode="$BUILD_NUMBER" \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
          cp app/build/outputs/bundle/release/app-release.aab "$GITHUB_WORKSPACE/findway-android-release.aab"

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk findway-android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: findway-android
          path: |
            findway-android-debug.apk
            findway-android-release.aab
          if-no-files-found: warn

      # The Play Console has to know the app first: the very first bundle is
      # uploaded by hand, after which the API can add releases to any track.
      - name: Upload to Play internal testing
        if: env.HAS_SIGNING == 'true' && env.HAS_PLAY == 'true' && inputs.upload
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ai.findway.app
          releaseFiles: findway-android-release.aab
          track: internal
          status: completed

  ios:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      HAS_SIGNING: ${{ secrets.APP_STORE_CONNECT_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the pages the app carries
        run: npm run mobile:build
      - name: Package them into the iOS project
        run: npx cap sync ios

      # App Store Connect only accepts apps built with the current iOS SDK
      # (iOS 26 as of 2026: "All iOS and iPadOS apps must be built with the
      # iOS 26 SDK or later"), and the runner's default Xcode trails it. The
      # image ships several versions, so pick the newest Xcode 26 present.
      - name: Select Xcode 26
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 26 on this runner image. Installed: $(ls /Applications | grep -i xcode | tr '\n' ' ')"
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      # A simulator build needs no signing, so it proves the project compiles
      # on every change and gives reviewers something to run.
      - name: Build for the iOS Simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            CODE_SIGNING_ALLOWED=NO \
            build
          cd "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator"
          zip -qry "$GITHUB_WORKSPACE/Findway-simulator.app.zip" App.app

      - uses: actions/upload-artifact@v4
        with:
          name: findway-ios-simulator
          path: Findway-simulator.app.zip

      # One App Store Connect API key does everything below. The export step
      # uses it for cloud signing (Apple holds the distribution certificate, so
      # no certificate or provisioning profile is ever exported or stored
      # here), and altool finds it by key id under ~/private_keys.
      - name: Install the App Store Connect API key
        if: env.HAS_SIGNING == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s\n' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"

      # The archive is built unsigned on purpose. With automatic signing Xcode
      # signs an archive with a *development* profile and only signs for the
      # App Store at export time, and Apple refuses to issue a development
      # profile to a team with no registered devices ("Your team has no
      # devices from which to generate a provisioning profile"). The export
      # step below signs the app for the App Store, which needs no device, so
      # nothing is lost by skipping the development signature here.
      - name: Archive for the App Store
        if: env.HAS_SIGNING == 'true'
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Findway.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            archive

      - name: Export the signed .ipa
        if: env.HAS_SIGNING == 'true'
        run: |
          cat > "$RUNNER_TEMP/export.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Findway.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/export.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          cp "$RUNNER_TEMP"/export/*.ipa "$GITHUB_WORKSPACE/findway-ios-release.ipa"

      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING == 'true'
        with:
          name: findway-ios
          path: findway-ios-release.ipa

      # The app record (bundle id ai.findway.app) must already exist in App
      # Store Connect; the upload lands in TestFlight under that app.
      - name: Upload to TestFlight
        if: env.HAS_SIGNING == 'true' && inputs.upload
        run: |
          xcrun altool --upload-app --type ios \
            --file findway-ios-release.ipa \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"
